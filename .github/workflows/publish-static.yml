name: Publish static site for Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-static-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Publish generated files to deploy branch
        env:
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -f .next-build/index.html

          deploy_dir="$(mktemp -d)"
          cp -R .next-build/. "$deploy_dir/"
          touch "$deploy_dir/.nojekyll"

          cd "$deploy_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish static site from ${GITHUB_SHA::7}"
          git branch -M deploy
          git remote add origin "https://x-access-token:${DEPLOY_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force origin deploy
